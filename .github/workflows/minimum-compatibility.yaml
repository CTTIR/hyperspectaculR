# Exact minimum R with selected minimum and current rendering dependencies.
name: Minimum compatibility

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions: read-all

jobs:
  minimum:
    runs-on: ubuntu-latest
    container: rocker/r-ver:4.1.0
    strategy:
      fail-fast: false
      matrix:
        ggplot2: [current, "3.4.0"]
    env:
      GGPLOT_VERSION: ${{ matrix.ggplot2 }}
      USE_BUNDLED_LIBUV: "1"
      NOT_CRAN: "true"
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git libuv1-dev cmake libxml2-dev libpng-dev fonts-liberation

      - uses: actions/checkout@v4

      - name: Install package and test dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"), Ncpus = 2)
          install.packages(c("cli", "ggplot2", "rlang", "scales", "viridisLite",
                             "testthat", "withr", "patchwork", "vdiffr"))
          if (Sys.getenv("GGPLOT_VERSION") == "3.4.0") {
            install.packages(c("isoband", "tibble"))
            install.packages("https://cran.r-project.org/src/contrib/Archive/ggplot2/ggplot2_3.4.0.tar.gz",
                             repos = NULL, type = "source")
            install.packages("https://cran.r-project.org/src/contrib/Archive/patchwork/patchwork_1.1.3.tar.gz",
                             repos = NULL, type = "source")
          }
          library(ggplot2)
          library(patchwork)
          library(vdiffr)
          if (as.character(getRversion()) != "4.1.0") cli::cli_abort("Unexpected R version.")
          if (Sys.getenv("GGPLOT_VERSION") == "3.4.0" &&
              as.character(packageVersion("ggplot2")) != "3.4.0") {
            cli::cli_abort("Unexpected ggplot2 version.")
          }
          print(sessionInfo())

      - name: Test the declared minimum
        shell: Rscript {0}
        run: |
          library(patchwork)
          if (Sys.getenv("GGPLOT_VERSION") == "3.4.0") {
            # The SVG baseline targets current ggplot; numeric geometry and
            # explicit patchwork integration still run on the old-ggplot leg.
            Sys.setenv(HSA_VDIFFR = "0")
          } else {
            Sys.setenv(HSA_REQUIRE_VDIFFR = "1")
          }
          testthat::test_local(".", reporter = "summary", stop_on_failure = TRUE)
          pkgload::load_all(".", quiet = TRUE)
          p <- hsa_fusion(hsa_demo_cube(rows = 3, cols = 4))
          combined <- p + p
          if (!inherits(combined, "patchwork")) cli::cli_abort("Composition failed.")
          testthat::expect_error(hsa_provenance(combined), "component")
          testthat::expect_identical(hsa_provenance(combined[[1]]), hsa_provenance(p))
